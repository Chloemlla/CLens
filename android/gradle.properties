org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Gradle 9.5 + AGP 8.13.x currently emits deprecation warnings from AGP internals when it
# declares aapt2/lint-gradle using multi-string dependency notation. That is not app code.
# Keep summary mode so CI surfaces real project warnings without flooding the problems report.
org.gradle.warning.mode=summary

# AGP 8.13.2 was validated against compileSdk 36.1 only. compileSdk 37 is intentional
# (targetSdk 37 requires it), so acknowledge the untested-SDK notice instead of letting it
# reappear on every build.
android.suppressUnsupportedCompileSdk=37.0

